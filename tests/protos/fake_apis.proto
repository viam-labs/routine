syntax = "proto3";

package test.fake.v1;

// Custom APIs used by tests. They are not part of the Viam SDK, so routine
// must discover them through server reflection.

service FakeNavService {
  rpc NavigateToLocation(NavigateToLocationRequest) returns (NavigateToLocationResponse);
  rpc GoToLocation(GoToLocationRequest) returns (GoToLocationResponse);
}

service SpeakerService {
  rpc Play(PlayRequest) returns (PlayResponse);
}

message NavigateToLocationRequest {
  string name = 1;
  string location_name = 2;
}

message NavigateToLocationResponse {}

message GoToLocationRequest {
  string name = 1;
  string location_name = 2;
  double linear_m_per_sec = 3;
}

message GoToLocationResponse {}

message PlayRequest {
  string name = 1;
  string sound = 2;
}

message PlayResponse {}
